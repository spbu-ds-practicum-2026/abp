syntax = "proto3";

package pmwallet.v1;

service NodeService {
  rpc GetBalance(GetBalanceRequest)
      returns (GetBalanceResponse);

  rpc PrepareTransaction(PrepareTransactionRequest)
      returns (PrepareTransactionResponse);

  rpc SubmitTransaction(SubmitTransactionRequest)
      returns (SubmitTransactionResponse);

  rpc GetTransactionStatus(GetTransactionStatusRequest)
      returns (GetTransactionStatusResponse);
}

message GetBalanceRequest {
  bytes address = 1;
}

message GetBalanceResponse {
  uint64 balance = 1;
  uint64 block_height = 2;
}

message PrepareTransactionRequest {
  bytes sender_public_key = 1;
  string recipient_address = 2;
  uint64 amount = 3;
}

message PrepareTransactionResponse {
  Transaction unsigned_transaction = 1;
}

message SubmitTransactionRequest {
  Transaction signed_transaction = 1;
}

message Transaction {
  repeated TransactionInput inputs = 1;
  repeated TransactionOutput outputs = 2;
}

message TransactionInput {
  bytes previous_tx_id = 1;
  uint32 output_index = 2;
  bytes public_key = 3;
  bytes signature = 4;
}

message TransactionOutput {
  string recipient = 1;
  uint64 amount = 2;
}

message SubmitTransactionResponse {
  string tx_id = 1;
}

message GetTransactionStatusRequest {
  string tx_id = 1;
}

message GetTransactionStatusResponse {
  TransactionStatus status = 1;
  uint64 confirmations = 2;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_PENDING = 1;
  TRANSACTION_STATUS_CONFIRMED = 2;
  TRANSACTION_STATUS_FINALIZED = 3;
  TRANSACTION_STATUS_REJECTED = 4;
  TRANSACTION_STATUS_NOT_FOUND = 5;
}
