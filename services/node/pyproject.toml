[project]
name = "node"
version = "0.1.0"
description = "PMWallet Node service"
requires-python = ">=3.14"
authors = [
    { name = "m-xim", email = "170838360+m-xim@users.noreply.github.com" }
]
dependencies = [
    "betterproto2>=0.10.0",
    "dature[toml]>=1.6.4",
    "fastapi>=0.165.0",
    "grpcio>=1.85.3",
    "grpclib>=0.4.9",
    "uvicorn[standard,standart]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
